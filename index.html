<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RQI · 오류리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E16; --surface:#101623; --surface-2:#161D2C; --border:#232C40;
    --ink:#EAF1F8; --ink-muted:#8E9AB0; --ink-faint:#576079;
    --amber:#2DD4EA; --amber-soft:#2DD4EA1A;
    --red:#F1584A; --red-soft:#F1584A1E;
    --gold:#F0B429; --gold-soft:#F0B4291E;
    --green:#34D399; --green-soft:#34D3991E;
    --blue:#6C8EF5; --blue-soft:#6C8EF51E;
    --radius:12px;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.35);
    --shadow-md:0 6px 24px rgba(0,0,0,0.45);
    --shadow-glow:0 0 0 1px rgba(45,212,234,0.35), 0 0 24px rgba(45,212,234,0.22);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans KR', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(45,212,234,0.10), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(108,142,245,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 32px);
    background-attachment:fixed;
  }
  ::selection{background:var(--amber-soft);color:var(--ink);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,14,22,0.78);backdrop-filter:blur(14px);z-index:20;}
  .brand-lockup{display:flex;align-items:center;gap:14px;}
  .brand-block{display:flex;flex-direction:column;line-height:1.28;}
  .brand-block span{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:0.22em;color:var(--ink);text-transform:uppercase;}
  .brand-divider{width:1px;height:26px;background:var(--border);}
  .rqi-block{display:flex;flex-direction:column;line-height:1.28;}
  .rqi-block .rqi-title{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:0.22em;color:var(--amber);text-transform:uppercase;text-shadow:0 0 12px rgba(45,212,234,0.5);}
  .rqi-block .rqi-sub{font-family:var(--font-mono);font-weight:400;font-size:9px;letter-spacing:0.03em;color:var(--ink-faint);white-space:nowrap;margin-top:1px;}
  .brand .mark{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0.02em;color:var(--ink);}
  .brand .sub{font-size:12px;color:var(--ink-faint);font-family:var(--font-mono);}
  .top-actions{display:flex;align-items:center;gap:14px;}
  .sync-status{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
  .btn{font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);cursor:pointer;transition:.15s ease;}
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#04141A;box-shadow:0 0 16px rgba(45,212,234,0.25);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red);border-color:var(--red-soft);}
  .btn.danger:hover{border-color:var(--red);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn.block{width:100%;}

  .module-bar{display:flex;align-items:center;gap:6px;padding:0 28px;border-bottom:1px solid var(--border);background:var(--bg);}
  .module-tab{font-family:var(--font-display);font-weight:600;font-size:13px;padding:12px 16px;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;transition:.12s ease;user-select:none;}
  .module-tab.active{color:var(--amber);border-color:var(--amber);text-shadow:0 0 10px rgba(45,212,234,0.4);}
  .module-tab.disabled{cursor:default;opacity:.4;}
  .module-tab .soon{font-family:var(--font-mono);font-size:10px;margin-left:6px;color:var(--ink-faint);}

  .flow-strip{display:flex;align-items:center;gap:28px;padding:14px 28px 0;}
  .flow-node{display:flex;align-items:center;gap:8px;cursor:pointer;padding-bottom:14px;border-bottom:2px solid transparent;}
  .flow-node .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
  .flow-node .label{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--ink-muted);}
  .flow-node .count{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);background:var(--surface-2);padding:2px 7px;border-radius:20px;}
  .flow-node.active{border-color:var(--amber);}
  .flow-node.active .dot{background:var(--amber);box-shadow:0 0 8px rgba(45,212,234,0.8);}
  .flow-node.active .label{color:var(--ink);}
  .flow-connector{flex:0 0 30px;height:1px;background:var(--border);margin-bottom:14px;}

  main{padding:24px 28px 60px;max-width:1180px;margin:0 auto;}

  .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
  .search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--ink);font-family:var(--font-body);font-size:13px;width:220px;}
  .search:focus{outline:none;border-color:var(--amber);}

  .row-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:16px;cursor:pointer;transition:.15s ease;box-shadow:var(--shadow-sm);}
  .row-card:hover{border-color:var(--amber);background:var(--surface);box-shadow:var(--shadow-glow);transform:translateY(-1px);}
  .row-id{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);width:100px;flex-shrink:0;padding-top:2px;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-meta{font-size:12px;color:var(--ink-muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
  .row-note{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:5px 9px;}
  .row-note .tag-icon{color:var(--amber);margin-right:4px;}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;font-family:var(--font-mono);}
  .badge.error{background:var(--red-soft);color:var(--red);}
  .badge.hold{background:var(--gold-soft);color:var(--gold);}
  .badge.done{background:var(--green-soft);color:var(--green);}
  .row-tags{display:flex;gap:6px;flex-shrink:0;}
  .row-progress{display:flex;gap:4px;flex-shrink:0;padding-top:4px;}
  .prog-dot{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .prog-dot.on{background:var(--amber);}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-faint);}
  .empty .big{font-family:var(--font-display);font-size:16px;color:var(--ink-muted);margin-bottom:6px;}

  .overlay{position:fixed;inset:0;background:rgba(4,6,10,0.72);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto;backdrop-filter:blur(4px);}
  .overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:580px;padding:26px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.55), 0 0 40px rgba(45,212,234,0.06);}
  .modal h2{font-family:var(--font-display);font-size:18px;margin:0 0 2px;}
  .modal .modal-sub{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:6px;}
  .field select, .field input, .field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:var(--font-body);font-size:13px;}
  .field textarea{resize:vertical;min-height:76px;}
  .field select:focus, .field input:focus, .field textarea:focus{outline:none;border-color:var(--amber);}
  .toggle-row{display:flex;gap:10px;margin:4px 0 14px;}
  .toggle{flex:1;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;background:var(--surface-2);transition:.12s ease;}
  .toggle.on{border-color:var(--green);background:var(--green-soft);}
  .toggle .t-label{font-size:12px;color:var(--ink-muted);}
  .toggle.on .t-label{color:var(--green);font-weight:600;}
  .toggle .t-state{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;}
  .modal-actions .right{display:flex;gap:8px;}
  .modal-close{position:absolute;top:20px;right:24px;background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;}
  .readonly-note{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-muted);font-family:var(--font-mono);white-space:pre-wrap;}
  .readonly-block{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);white-space:pre-wrap;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px;}
  .kv-grid .kv label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
  .kv-grid .kv .v{font-size:13px;color:var(--ink);}

  /* dashboard */
  .dash-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .period-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .period-controls select, .period-controls input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--ink);font-family:var(--font-body);font-size:12.5px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
  .kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kpi-accent, var(--amber));}
  .kpi .num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ink);}
  .kpi .lbl{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .kpi .sub{font-size:10.5px;color:var(--ink-faint);margin-top:4px;font-family:var(--font-mono);}
  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:860px){ .dash-grid{grid-template-columns:1fr;} }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .panel h3{font-family:var(--font-display);font-size:14px;margin:0 0 14px;color:var(--ink-muted);display:flex;justify-content:space-between;align-items:center;}
  .panel h3 .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:130px;font-size:12px;color:var(--ink-muted);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:var(--amber);}
  .bar-count{width:56px;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);}

  .donut-wrap{display:flex;align-items:center;gap:20px;}
  .donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;}
  .donut-legend{flex:1;display:flex;flex-direction:column;gap:8px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-muted);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-item .pct{margin-left:auto;font-family:var(--font-mono);color:var(--ink-faint);}

  .trend-chart{display:flex;align-items:flex-end;gap:6px;height:110px;}
  .trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;}
  .trend-bar{width:100%;background:var(--amber);border-radius:3px 3px 0 0;min-height:2px;}
  .trend-label{font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);}

  .rank-list{display:flex;flex-direction:column;gap:6px;}
  .rank-item{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
  .rank-item:last-child{border-bottom:none;}
  .rank-num{width:18px;color:var(--ink-faint);font-family:var(--font-mono);font-size:11px;}
  .rank-name{flex:1;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-val{font-family:var(--font-mono);color:var(--ink);}
  .bar-row.clickable:hover .bar-label, .bar-row.clickable:hover .bar-count{color:var(--amber);}
  .legend-item.clickable:hover{color:var(--amber);}
  .trend-col.clickable:hover .trend-bar{filter:brightness(1.3);}
  .trend-col.clickable:hover .trend-label{color:var(--amber);}

  .inline-drill{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .inline-drill-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .inline-drill-head .t{font-size:12px;color:var(--amber);font-weight:600;}
  .mini-list-scroll{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);}
  .mini-list-scroll::-webkit-scrollbar{width:8px;}
  .mini-list-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .mini-list-scroll::-webkit-scrollbar-thumb:hover{background:var(--amber);}
  .mini-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;cursor:pointer;transition:.1s ease;border-bottom:1px solid var(--border);}
  .mini-row:last-child{border-bottom:none;}
  .mini-row:hover{background:var(--surface);}
  .mini-row .mid{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);width:74px;flex-shrink:0;padding-top:1px;}
  .mini-row .mbody{flex:1;min-width:0;}
  .mini-row .mtop{display:flex;justify-content:space-between;gap:8px;}
  .mini-row .mname{color:var(--ink-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-row .mstage{font-size:10px;font-family:var(--font-mono);color:var(--ink-faint);flex-shrink:0;}
  .mini-row .mnote{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .explore-banner{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--amber);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;}
  .explore-banner .t{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--amber);}
  .explore-banner .c{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-left:8px;}
  .worker-summary{display:flex;gap:20px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .worker-summary .ws-item{font-size:12px;color:var(--ink-muted);}
  .worker-summary .ws-item b{color:var(--ink);font-family:var(--font-mono);}

  .log-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-date{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-bottom:4px;}
  .log-body{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;}
  .log-action{font-family:var(--font-display);font-weight:600;color:var(--amber);font-size:12px;}
  .log-stat{color:var(--ink-muted);font-family:var(--font-mono);font-size:11.5px;}
  .log-note{color:var(--ink-faint);font-size:11px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--amber);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--ink);z-index:100;display:none;max-width:80vw;box-shadow:0 0 24px rgba(45,212,234,0.25);}
  .toast.show{display:block;}

  @media (max-width:640px){
    .topbar{padding:14px 16px;} main{padding:18px 16px 60px;}
    .flow-strip{padding:14px 16px 0;gap:14px;overflow-x:auto;} .flow-connector{flex:0 0 12px;}
    .row-card{flex-wrap:wrap;}
    .kv-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand-lockup">
    <div class="brand-block"><span>MOMOS</span><span>COFFEE</span></div>
    <div class="brand-divider"></div>
    <div class="rqi-block"><span class="rqi-title">RQI</span><span class="rqi-sub">Roasting Quality Intelligence</span></div>
  </div>
  <div class="top-actions">
    <div class="sync-status" id="syncStatus">동기화 정보 로딩 중…</div>
    <button class="btn small" id="syncLogBtn">📋 동기화 로그</button>
    <button class="btn" id="syncBtn">Cropster 동기화</button>
  </div>
</div>

<div class="module-bar">
  <div class="module-tab active" data-module="error-report">오류리포트</div>
  <div class="module-tab disabled" title="다음 단계에서 추가 예정">목표이탈<span class="soon">예정</span></div>
  <div class="module-tab disabled" title="다음 단계에서 추가 예정">통합 품질 이벤트<span class="soon">예정</span></div>
</div>

<div class="flow-strip" id="flowStrip">
  <div class="flow-node active" data-tab="waiting"><span class="dot"></span><span class="label">입력대기</span><span class="count" id="cntWaiting">0</span></div>
  <div class="flow-connector"></div>
  <div class="flow-node" data-tab="progress"><span class="dot"></span><span class="label">진행</span><span class="count" id="cntProgress">0</span></div>
  <div class="flow-connector"></div>
  <div class="flow-node" data-tab="history"><span class="dot"></span><span class="label">히스토리</span><span class="count" id="cntHistory">0</span></div>
  <div class="flow-connector"></div>
  <div class="flow-node" data-tab="dashboard"><span class="dot"></span><span class="label">대시보드</span></div>
</div>

<main>
  <div class="list-head">
    <input class="search" id="searchInput" placeholder="배치명 / Roast ID 검색" />
    <select class="search" id="workerFilterSelect" style="width:160px;">
      <option value="">작업자 전체</option>
    </select>
  </div>
  <div id="listContainer"></div>
  <div id="dashboardContainer" style="display:none;"></div>
</main>

<!-- 입력대기 모달: 오류분류(드롭다운) + 오류 세부내용(자유서술) -->
<div class="overlay" id="issueOverlay">
  <div class="modal">
    <button class="modal-close" id="issueClose">✕</button>
    <h2 id="issueTitle">배치 정보</h2>
    <div class="modal-sub" id="issueSub"></div>
    <div class="field">
      <label>Cropster 비고 원문</label>
      <div class="readonly-note" id="issueNote"></div>
    </div>

    <div class="field">
      <label>오류분류</label>
      <select id="f_category"></select>
    </div>

    <div class="field">
      <label>오류 세부내용 <span style="font-weight:400;color:var(--ink-faint);">— 왜 그런 일이 일어났는지 상세히 서술</span></label>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://uljjsqllsehrzilbcaoz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsampzcWxsc2VocnppbGJjYW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0OTY2MDgsImV4cCI6MjA5MDA3MjYwOH0.8nxTOzS8gto20RpL-XXWEe1Br4OU7WETt1CeKS0r-68';
const SYNC_FN_URL = `${SUPABASE_URL}/functions/v1/rqi-cropster-sync`;

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = 'waiting';
let allRows = [];
let searchTerm = '';
let workerFilter = '';
let activeBatchId = null;
let categoryOptions = [];
let dispositionOptions = [];
let productCategoryOptions = [];
let productNameSearchTimer = null;
let periodFrom = '';
let periodTo = '';
let workerStatsMap = {};
let drilldown = null; // { field: 'category'|'disposal'|'worker'|'month', value, label }

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const DISPOSAL_COLORS = ['#2DD4EA','#6C8EF5','#34D399','#F0B429','#F1584A','#B389F0'];

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// ── 옵션(오류분류/처리방법) 로드 ──
async function loadOptions(){
  const [{ data: cats }, { data: disps }, { data: prodCats }] = await Promise.all([
    sb.from('오류리포트_categories').select('*').eq('active', true).order('id'),
    sb.from('오류리포트_dispositions').select('*').eq('active', true).order('id'),
    sb.from('오류리포트_product_categories').select('*').eq('active', true).order('id'),
  ]);
  categoryOptions = cats || [];
  dispositionOptions = disps || [];
  productCategoryOptions = prodCats || [];
}
function populateSelect(selectEl, options, addLabel){
  selectEl.innerHTML = options.map(o => `<option value="${escapeHtml(o.name)}">${escapeHtml(o.name)}</option>`).join('')
    + `<option value="__add__">+ ${addLabel} 추가…</option>`;
}
async function handleAddOption(selectEl, table, addLabel, reloadFn){
  if (selectEl.value !== '__add__') return;
  const name = prompt(`새 ${addLabel}을(를) 입력하세요`);
  if (!name || !name.trim()){ selectEl.selectedIndex = 0; return; }
  const { error } = await sb.from(table).insert({ name: name.trim() });
  if (error){
    toast('추가 실패: ' + (error.message.includes('duplicate') ? '이미 존재하는 항목이에요' : error.message));
    selectEl.selectedIndex = 0; return;
  }
  await loadOptions();
  await reloadFn();
  selectEl.value = name.trim();
  toast(`"${name.trim()}" 추가됐어요`);
}

// ── 데이터 로드 ──
async function loadAll(){
  const { data, error } = await sb.from('rqi_batch_overview').select('*').order('roast_date', { ascending:false });
  if (error){ toast('불러오기 실패: ' + error.message); console.error(error); return; }
  allRows = data || [];
  renderCounts();
  populateWorkerFilter();
  render();
}
async function loadSyncState(){
  const { data } = await sb.from('오류리포트_sync_state').select('*').eq('id','main').maybeSingle();
  if (data?.last_synced_at){
    const d = new Date(data.last_synced_at);
    $('#syncStatus').textContent = '마지막 동기화 ' + d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } else {
    $('#syncStatus').textContent = '동기화 기록 없음';
  }
}

function renderCounts(){
  $('#cntWaiting').textContent = allRows.filter(r => r.current_stage === '입력대기').length;
  $('#cntProgress').textContent = allRows.filter(r => r.current_stage === '진행').length;
  $('#cntHistory').textContent = allRows.filter(r => r.current_stage === '히스토리').length;
}
function filteredRows(stage){
  return allRows.filter(r => r.current_stage === stage).filter(r => {
    if (workerFilter && (r.worker || '') !== workerFilter) return false;
    if (!searchTerm) return true;
    const s = searchTerm.toLowerCase();
    return (r.roast_name||'').toLowerCase().includes(s) || (r.cropster_batch_id||'').toLowerCase().includes(s);
  });
}
function populateWorkerFilter(){
  const sel = $('#workerFilterSelect');
  const prevValue = sel.value;
  const workers = Array.from(new Set(allRows.map(r => r.worker).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ko'));
  sel.innerHTML = `<option value="">작업자 전체</option>` + workers.map(w => `<option value="${escapeHtml(w)}">${escapeHtml(w)}</option>`).join('');
  if (workers.includes(prevValue)) sel.value = prevValue;
}
function tagBadges(r){
  let html = '';
  if (r.tag_error) html += `<span class="badge error">오류</span>`;
  if (r.tag_hold) html += `<span class="badge hold">보류</span>`;
  return html;
}

function render(){
  const container = $('#listContainer');
  const dash = $('#dashboardContainer');
  const listHead = document.querySelector('.list-head');
  if (currentTab === 'dashboard'){
    container.style.display = 'none'; dash.style.display = 'block';
    if (listHead) listHead.style.display = 'none';
    renderDashboard();
    return;
  }
  container.style.display = 'block'; dash.style.display = 'none';

  if (currentTab === 'explore'){
    if (listHead) listHead.style.display = 'none';
    renderExplore(container);
    return;
  }
  if (listHead) listHead.style.display = 'flex';

  const stageMap = { waiting: '입력대기', progress: '진행', history: '히스토리' };
  const rows = filteredRows(stageMap[currentTab]);

  if (!rows.length){
    container.innerHTML = `<div class="empty"><div class="big">표시할 배치가 없습니다</div>지금은 이 단계에 걸린 배치가 없어요.</div>`;
    return;
  }

  container.innerHTML = rows.map(r => {
    let progressDots = '';
    if (currentTab === 'progress'){
      progressDots = `<div class="row-progress"><span class="prog-dot ${r.physical_done?'on':''}" title="실물"></span><span class="prog-dot ${r.system_done?'on':''}" title="전산"></span></div>`;
    }
    if (currentTab === 'history'){ progressDots = `<span class="badge done">완료</span>`; }
    const noteHtml = (currentTab === 'waiting' && r.note)
      ? `<div class="row-note"><span class="tag-icon">✎</span>${escapeHtml(r.note)}</div>` : '';
    return `
    <div class="row-card" data-batch="${r.cropster_batch_id}">
      <div class="row-id">${r.cropster_batch_id}</div>
      <div class="row-main">
        <div class="row-title">${r.roast_name || '(이름없음)'} ${r.item_name ? '· '+r.item_name : ''}</div>
        <div class="row-meta">
          <span>${r.roast_date || '-'}</span>
          <span>${r.machine || '-'}</span>
          <span>${r.worker || '-'}</span>
          ${r.category ? `<span>${r.category}</span>` : ''}
        </div>
        ${noteHtml}
      </div>
      <div class="row-tags">${tagBadges(r)}</div>
      ${progressDots}
    </div>`;
  }).join('');

  $$('#listContainer .row-card').forEach(card => card.addEventListener('click', () => openBatch(card.dataset.batch)));
}

function openBatch(batchId){
  const r = allRows.find(x => x.cropster_batch_id === batchId);
  if (!r) return;
  activeBatchId = batchId;

  if (r.current_stage === '입력대기'){
    $('#issueTitle').textContent = r.roast_name || batchId;
    $('#issueSub').textContent = `${batchId} · ${r.roast_date || ''} · ${r.machine || ''} · ${r.worker || ''}`;
    $('#issueNote').textContent = r.note || '(Cropster 비고 없음)';
    populateSelect($('#f_category'), categoryOptions, '오류분류');
    $('#f_category').value = categoryOptions[0]?.name || '';
    $('#f_description').value = '';
    $('#f_assignee').value = '';
    $('#issueOverlay').classList.add('show');
  } else if (r.current_stage === '진행'){
    $('#progressTitle').textContent = r.roast_name || batchId;
    $('#progressSub').textContent = `${batchId} · ${r.category || ''} · ${r.assignee || ''}`;
    $('#progressDescNote').textContent = r.description || '(세부내용 없음)';
    populateSelect($('#f_disposal'), dispositionOptions, '처리방법');
    $('#f_disposal').value = r.disposal || dispositionOptions[0]?.name || '';
    populateSelect($('#f_product_category'), productCategoryOptions, '사용상품분류');
    $('#f_product_category').value = r.product_category || productCategoryOptions[0]?.name || '';
    $('#f_product_name').value = r.product_name || '';
    $('#f_action_detail').value = r.action_detail || '';
    setToggleState('physical', r.physical_done);
    setToggleState('system', r.system_done);
    $('#progressOverlay').classList.add('show');
  } else {
    $('#historyTitle').textContent = r.roast_name || batchId;
    $('#historySub').textContent = `${batchId} · ${r.roast_date || ''} · ${r.machine || ''}`;
    $('#h_category').textContent = r.category || '-';
    $('#h_disposal').textContent = r.disposal || '-';
    $('#h_product_category').textContent = r.product_category || '-';
    $('#h_product_name').textContent = r.product_name || '-';
    $('#h_assignee').textContent = r.assignee || '-';
    $('#h_completed').textContent = r.completed_at || '-';
    $('#h_description').textContent = r.description || '(내용 없음)';
    $('#h_action_detail').textContent = r.action_detail || '(내용 없음)';
    $('#historyOverlay').classList.add('show');
  }
}
function setToggleState(kind, on){
  $(`#toggle-${kind}`).classList.toggle('on', !!on);
  $(`#${kind}State`).textContent = on ? '완료' : '미완료';
}

// ── 입력대기 → 진행 ──
$('#f_category').addEventListener('change', (e) => handleAddOption(e.target, '오류리포트_categories', '오류분류', async()=>{}));
$('#issueSave').addEventListener('click', async () => {
  if ($('#f_category').value === '__add__'){ toast('오류분류를 선택해주세요'); return; }
  const payload = {
    batch_id: activeBatchId,
    category: $('#f_category').value,
    description: $('#f_description').value,
    assignee: $('#f_assignee').value,
    physical_done: false, system_done: false,
  };
  const { error } = await sb.from('오류리포트_issues').insert(payload);
  if (error){ toast('저장 실패: ' + error.message); return; }
  $('#issueOverlay').classList.remove('show');
  toast('저장됐습니다 · 진행 탭으로 이동했어요');
  await loadAll();
});
$('#issueCancel').addEventListener('click', () => $('#issueOverlay').classList.remove('show'));
$('#issueClose').addEventListener('click', () => $('#issueOverlay').classList.remove('show'));

// ── 진행 ──
$('#f_disposal').addEventListener('change', (e) => handleAddOption(e.target, '오류리포트_dispositions', '처리방법', async()=>{}));
$('#f_product_category').addEventListener('change', (e) => handleAddOption(e.target, '오류리포트_product_categories', '사용상품분류', async()=>{}));

// 사용상품(Cropster 프로파일명) 검색 자동완성
$('#f_product_name').addEventListener('input', (e) => {
  clearTimeout(productNameSearchTimer);
  const q = e.target.value.trim();
  const box = $('#productNameSuggest');
  if (!q){ box.style.display = 'none'; return; }
  productNameSearchTimer = setTimeout(async () => {
    const { data } = await sb.from('오류리포트_profile_names').select('name').ilike('name', `%${q}%`).order('name').limit(15);
    if (!data || !data.length){ box.style.display = 'none'; return; }
    box.innerHTML = data.map(d => `<div class="suggest-item" data-name="${escapeHtml(d.name)}" style="padding:8px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border);">${escapeHtml(d.name)}</div>`).join('');
    box.style.display = 'block';
    box.querySelectorAll('.suggest-item').forEach(item => {
      item.addEventListener('click', () => {
        $('#f_product_name').value = item.dataset.name;
        box.style.display = 'none';
      });
      item.addEventListener('mouseenter', () => item.style.background = 'var(--surface)');
      item.addEventListener('mouseleave', () => item.style.background = 'transparent');
    });
  }, 200);
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#f_product_name') && !e.target.closest('#productNameSuggest')){
    $('#productNameSuggest').style.display = 'none';
  }
});
$('#toggle-physical').addEventListener('click', () => toggleProgress('physical'));
$('#toggle-system').addEventListener('click', () => toggleProgress('system'));

async function toggleProgress(kind){
  const r = allRows.find(x => x.cropster_batch_id === activeBatchId);
  if (!r) return;
  const field = kind === 'physical' ? 'physical_done' : 'system_done';
  const newVal = !r[field];
  const { error } = await sb.from('오류리포트_issues').update({ [field]: newVal }).eq('id', r.issue_id);
  if (error){ toast('업데이트 실패: ' + error.message); return; }
  setToggleState(kind, newVal);
  await loadAll();
  const stillThere = allRows.find(x => x.cropster_batch_id === activeBatchId);
  if (stillThere && stillThere.current_stage === '히스토리'){
    toast('실물·전산 처리 완료 — 히스토리로 이동했습니다');
    $('#progressOverlay').classList.remove('show');
  }
}
$('#progressSaveDetail').addEventListener('click', async () => {
  const r = allRows.find(x => x.cropster_batch_id === activeBatchId);
  if (!r) return;
  if ($('#f_disposal').value === '__add__'){ toast('처리방법을 선택해주세요'); return; }
  if ($('#f_product_category').value === '__add__'){ toast('사용상품분류를 선택해주세요'); return; }
  const { error } = await sb.from('오류리포트_issues').update({
    disposal: $('#f_disposal').value,
    action_detail: $('#f_action_detail').value,
    product_category: $('#f_product_category').value,
    product_name: $('#f_product_name').value,
  }).eq('id', r.issue_id);
  if (error){ toast('저장 실패: ' + error.message); return; }
  toast('세부내용 저장됐어요');
  await loadAll();
});
$('#progressRevert').addEventListener('click', async () => {
  const r = allRows.find(x => x.cropster_batch_id === activeBatchId);
  if (!r) return;
  if (!confirm('입력대기 단계로 되돌리시겠어요? 지금까지 입력한 원인·처리 정보가 삭제됩니다.')) return;
  const { error } = await sb.from('오류리포트_issues').delete().eq('id', r.issue_id);
  if (error){ toast('되돌리기 실패: ' + error.message); return; }
  $('#progressOverlay').classList.remove('show');
  toast('입력대기로 되돌렸어요');
  await loadAll();
});

// ══════════════════════ 대시보드 ══════════════════════
function periodFilteredRows(){
  return allRows.filter(r => {
    if (!r.roast_date) return !periodFrom && !periodTo;
    if (periodFrom && r.roast_date < periodFrom) return false;
    if (periodTo && r.roast_date > periodTo) return false;
    return true;
  });
}
function applyPeriodPreset(preset){
  const today = new Date();
  const fmt = (d) => d.toISOString().slice(0,10);
  if (preset === 'all'){ periodFrom=''; periodTo=''; }
  else if (preset === 'month'){
    periodFrom = fmt(new Date(today.getFullYear(), today.getMonth(), 1));
    periodTo = fmt(today);
  } else if (preset === 'lastmonth'){
    periodFrom = fmt(new Date(today.getFullYear(), today.getMonth()-1, 1));
    periodTo = fmt(new Date(today.getFullYear(), today.getMonth(), 0));
  } else if (preset === 'quarter'){
    periodFrom = fmt(new Date(today.getFullYear(), today.getMonth()-2, 1));
    periodTo = fmt(today);
  }
  renderDashboard();
}

function donutSlice(cx, cy, r, startAngle, endAngle, color){
  const toXY = (ang) => [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
  const [x1,y1] = toXY(startAngle), [x2,y2] = toXY(endAngle);
  const large = (endAngle-startAngle) > Math.PI ? 1 : 0;
  return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${color}"></path>`;
}
function buildDonut(entries){
  const total = entries.reduce((s,[,v])=>s+v,0) || 1;
  let angle = -Math.PI/2;
  let svg = '';
  entries.forEach(([name,val], i) => {
    const frac = val/total;
    const end = angle + frac*Math.PI*2;
    svg += donutSlice(60,60,58,angle,end, DISPOSAL_COLORS[i % DISPOSAL_COLORS.length]);
    angle = end;
  });
  return `<svg class="donut" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="var(--surface-2)"/>${svg}<circle cx="60" cy="60" r="34" fill="var(--surface)"/></svg>`;
}

let exploreFilter = null; // { field, value, label }
let exploreSubFilter = null; // 작업자 KPI 안에서 오류분류 추가 필터

function setDrilldown(field, value, label){
  drilldown = { field, value, label };
  renderDashboard();
}
function clearDrilldown(){ drilldown = null; renderDashboard(); }
function drilldownMatch(r){
  if (!drilldown) return false;
  if (drilldown.field === 'month') return (r.roast_date||'').slice(0,7) === drilldown.value;
  return (r[drilldown.field] || '') === drilldown.value;
}
function exploreMatch(r){
  if (!exploreFilter) return false;
  if (exploreFilter.field === 'month') return (r.roast_date||'').slice(0,7) === exploreFilter.value;
  return (r[exploreFilter.field] || '') === exploreFilter.value;
}
function openExplore(field, value, label){
  exploreFilter = { field, value, label };
  exploreSubFilter = null;
  currentTab = 'explore';
  render();
}
function closeExplore(){
  exploreFilter = null;
  exploreSubFilter = null;
  currentTab = 'dashboard';
  $$('.flow-node').forEach(n => n.classList.remove('active'));
  $(`.flow-node[data-tab="dashboard"]`)?.classList.add('active');
  render();
}
function setExploreSubFilter(category){
  exploreSubFilter = (exploreSubFilter === category) ? null : category;
  render();
}
function miniRowHtml(r){
  const noteHtml = r.note ? `<div class="mnote">${escapeHtml(r.note)}</div>` : '';
  return `<div class="mini-row" data-batch="${r.cropster_batch_id}">
    <span class="mid">${r.cropster_batch_id}</span>
    <div class="mbody">
      <div class="mtop"><span class="mname">${escapeHtml(r.roast_name || r.item_name || '(이름없음)')}</span><span class="mstage">${r.current_stage}</span></div>
      ${noteHtml}
    </div>
  </div>`;
}
function inlineDrillBlock(field, rows){
  if (!drilldown || drilldown.field !== field) return '';
  const matched = rows.filter(drilldownMatch).sort((a,b)=>(b.roast_date||'').localeCompare(a.roast_date||''));
  const preview = matched.slice(0, 20);
  return `
  <div class="inline-drill" data-drill-field="${field}">
    <div class="inline-drill-head">
      <span class="t">🔍 ${escapeHtml(drilldown.label)} · ${matched.length}건</span>
      <a href="#" class="clear-drill-link" style="color:var(--red);font-size:11px;text-decoration:none;">✕ 닫기</a>
    </div>
    <div class="mini-list-scroll">
      ${preview.map(miniRowHtml).join('') || `<div style="color:var(--ink-faint);font-size:12px;">없음</div>`}
    </div>
    ${matched.length > 20 ? `<div style="text-align:center;font-size:10.5px;color:var(--ink-faint);margin-top:4px;font-family:var(--font-mono);">스크롤해서 더 보기 · 상위 20건 표시중</div>` : ''}
    ${matched.length ? `<button class="btn small block explore-btn" style="margin-top:8px;" data-field="${field}" data-value="${escapeHtml(drilldown.value)}" data-label="${escapeHtml(drilldown.label)}">전체보기 (${matched.length}건) →</button>` : ''}
  </div>`;
}
function wireInlineDrill(container){
  container.querySelectorAll('.mini-row').forEach(row => row.addEventListener('click', () => openBatch(row.dataset.batch)));
  container.querySelectorAll('.clear-drill-link').forEach(link => link.addEventListener('click', (e) => { e.preventDefault(); clearDrilldown(); }));
  container.querySelectorAll('.explore-btn').forEach(btn => btn.addEventListener('click', () => openExplore(btn.dataset.field, btn.dataset.value, btn.dataset.label)));
}

function renderExplore(container){
  if (!exploreFilter){ container.innerHTML = ''; return; }
  const workerMatched = allRows.filter(exploreMatch); // KPI 계산용 (하위필터 적용 전, 작업자 전체)
  const matched = workerMatched.filter(r => {
    if (exploreSubFilter && (r.category || '') !== exploreSubFilter) return false;
    if (!searchTerm) return true;
    const s = searchTerm.toLowerCase();
    return (r.roast_name||'').toLowerCase().includes(s) || (r.cropster_batch_id||'').toLowerCase().includes(s);
  }).sort((a,b)=>(b.roast_date||'').localeCompare(a.roast_date||''));

  const subLabel = exploreSubFilter ? ` · 오류분류: ${exploreSubFilter}` : '';
  const banner = `<div class="explore-banner">
    <div><span class="t">🔍 ${escapeHtml(exploreFilter.label)}${escapeHtml(subLabel)}</span><span class="c">${matched.length}건</span></div>
    <button class="btn small" id="backToDashBtn">← 대시보드로</button>
  </div>`;

  let kpiCardHtml = '';
  if (exploreFilter.field === 'worker'){
    const workerName = exploreFilter.value;
    const stat = workerStatsMap[workerName];
    const rate = stat && stat.total_batches ? (workerMatched.length/stat.total_batches*100).toFixed(1) : null;

    const catCounts = {};
    workerMatched.forEach(r => { if (r.category) catCounts[r.category] = (catCounts[r.category]||0)+1; });
    const catEntries = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]);
    const catTotal = catEntries.reduce((s,[,v])=>s+v,0) || 1;
    const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));

    kpiCardHtml = `
    <div class="panel" style="border-color:var(--amber);">
      <h3>👤 ${escapeHtml(workerName)} 개인 KPI</h3>
      <div class="kpi-grid" style="margin-bottom:16px;">
        <div class="kpi" style="--kpi-accent:var(--blue)"><div class="num">${stat ? stat.total_batches.toLocaleString() : '-'}</div><div class="lbl">전체 로스팅 배치</div></div>
        <div class="kpi" style="--kpi-accent:var(--red)"><div class="num">${workerMatched.length}</div><div class="lbl">오류·보류 건수</div></div>
        <div class="kpi" style="--kpi-accent:var(--gold)"><div class="num">${rate !== null ? rate+'%' : '-'}</div><div class="lbl">오류율</div></div>
      </div>
      ${catEntries.length ? `
      <div style="font-size:12px;color:var(--ink-muted);margin-bottom:10px;font-weight:600;">오류분류별 내역 <span style="font-weight:400;color:var(--ink-faint);">— 클릭하면 아래 목록이 해당 분류로 좁혀져요</span></div>
      ${catEntries.map(([k,v],i) => `
        <div class="bar-row cat-subfilter" data-cat="${escapeHtml(k)}" style="cursor:pointer;${exploreSubFilter===k?'background:var(--amber-soft);border-radius:6px;':''}">
          <div class="bar-label" style="${exploreSubFilter===k?'color:var(--amber);font-weight:600;':''}">${escapeHtml(k)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100)}%;background:${DISPOSAL_COLORS[i%DISPOSAL_COLORS.length]}"></div></div>
          <div class="bar-count">${v}건 · ${Math.round(v/catTotal*100)}%</div>
        </div>`).join('')}
      ${exploreSubFilter ? `<div style="text-align:right;margin-top:6px;"><a href="#" id="clearSubFilterLink" style="color:var(--red);font-size:11px;text-decoration:none;">✕ 분류 필터 해제</a></div>` : ''}
      ` : `<div style="color:var(--ink-faint);font-size:13px;">분류가 입력된 항목이 없습니다</div>`}
    </div>`;
  }

  if (!matched.length){
    container.innerHTML = banner + kpiCardHtml + `<div class="empty"><div class="big">해당 조건의 배치가 없습니다</div></div>`;
    $('#backToDashBtn').addEventListener('click', closeExplore);
    wireExploreKpiClicks(container);
    return;
  }

  const rowsHtml = matched.map(r => {
    const stageBadge = r.current_stage === '히스토리' ? `<span class="badge done">완료</span>`
      : r.current_stage === '진행' ? `<span class="badge hold">진행</span>`
      : `<span class="badge error">입력대기</span>`;
    const noteHtml = r.note ? `<div class="row-note"><span class="tag-icon">✎</span>${escapeHtml(r.note)}</div>` : '';
    return `
    <div class="row-card" data-batch="${r.cropster_batch_id}">
      <div class="row-id">${r.cropster_batch_id}</div>
      <div class="row-main">
        <div class="row-title">${escapeHtml(r.roast_name || '(이름없음)')} ${r.item_name ? '· '+escapeHtml(r.item_name) : ''}</div>
        <div class="row-meta">
          <span>${r.roast_date || '-'}</span><span>${r.machine || '-'}</span><span>${r.worker || '-'}</span>
          ${r.category ? `<span>${escapeHtml(r.category)}</span>` : ''}
          ${r.disposal ? `<span>${escapeHtml(r.disposal)}</span>` : ''}
        </div>
        ${noteHtml}
      </div>
      ${stageBadge}
    </div>`;
  }).join('');

  container.innerHTML = banner + kpiCardHtml + rowsHtml;
  $('#backToDashBtn').addEventListener('click', closeExplore);
  container.querySelectorAll('.row-card').forEach(card => card.addEventListener('click', () => openBatch(card.dataset.batch)));
  wireExploreKpiClicks(container);
}
function wireExploreKpiClicks(container){
  container.querySelectorAll('.cat-subfilter').forEach(el => el.addEventListener('click', () => setExploreSubFilter(el.dataset.cat)));
  const clearLink = container.querySelector('#clearSubFilterLink');
  if (clearLink) clearLink.addEventListener('click', (e) => { e.preventDefault(); setExploreSubFilter(exploreSubFilter); });
}

function renderDashboard(){
  const dash = $('#dashboardContainer');
  const rows = periodFilteredRows();
  const total = rows.length;
  const waiting = rows.filter(r=>r.current_stage==='입력대기').length;
  const progress = rows.filter(r=>r.current_stage==='진행').length;
  const history = rows.filter(r=>r.current_stage==='히스토리').length;
  const errorCnt = rows.filter(r=>r.tag_error).length;
  const holdCnt = rows.filter(r=>r.tag_hold).length;
  const totalKg = rows.reduce((s,r)=>s+(Number(r.output_kg)||0),0);

  const catCounts = {};
  rows.forEach(r => { if (r.category) catCounts[r.category] = (catCounts[r.category]||0)+1; });
  const catEntries = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]);
  const catTotal = catEntries.reduce((s,[,v])=>s+v,0) || 1;
  const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));

  const dispCounts = {};
  rows.forEach(r => { if (r.disposal) dispCounts[r.disposal] = (dispCounts[r.disposal]||0)+1; });
  const dispEntries = Object.entries(dispCounts).sort((a,b)=>b[1]-a[1]);
  const dispTotal = dispEntries.reduce((s,[,v])=>s+v,0) || 1;

  const itemCounts = {};
  rows.forEach(r => { if (r.item_name) itemCounts[r.item_name] = (itemCounts[r.item_name]||0)+1; });
  const itemEntries = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const machineCounts = {};
  rows.forEach(r => { if (r.machine) machineCounts[r.machine] = (machineCounts[r.machine]||0)+1; });
  const machEntries = Object.entries(machineCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const workerCounts = {};
  rows.forEach(r => { if (r.worker) workerCounts[r.worker] = (workerCounts[r.worker]||0)+1; });
  const workerEntries = Object.entries(workerCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxWorker = Math.max(1, ...workerEntries.map(e=>e[1]));

  const monthCounts = {};
  rows.forEach(r => { if (r.roast_date){ const m = r.roast_date.slice(0,7); monthCounts[m] = (monthCounts[m]||0)+1; } });
  const months = Object.keys(monthCounts).sort();
  const maxMonth = Math.max(1, ...months.map(m=>monthCounts[m]));

  dash.innerHTML = `
    <div class="dash-toolbar">
      <div class="period-controls">
        <select id="periodPreset">
          <option value="all">전체 기간</option>
          <option value="month">이번 달</option>
          <option value="lastmonth">지난 달</option>
          <option value="quarter">최근 3개월</option>
        </select>
        <input type="date" id="periodFromInput" value="${periodFrom}" />
        <span style="color:var(--ink-faint);font-size:12px;">~</span>
        <input type="date" id="periodToInput" value="${periodTo}" />
        <button class="btn small" id="periodApply">적용</button>
      </div>
      <button class="btn primary small" id="reportBtn">📄 보고서 생성</button>
    </div>

    <div class="kpi-grid">
      <div class="kpi" style="--kpi-accent:var(--amber)"><div class="num">${total}</div><div class="lbl">전체 등록 배치</div></div>
      <div class="kpi" style="--kpi-accent:var(--blue)"><div class="num">${waiting}</div><div class="lbl">입력 필요</div><div class="sub">${total?Math.round(waiting/total*100):0}%</div></div>
      <div class="kpi" style="--kpi-accent:var(--gold)"><div class="num">${progress}</div><div class="lbl">처리 진행중</div><div class="sub">${total?Math.round(progress/total*100):0}%</div></div>
      <div class="kpi" style="--kpi-accent:var(--green)"><div class="num">${history}</div><div class="lbl">처리 완료</div><div class="sub">${total?Math.round(history/total*100):0}%</div></div>
      <div class="kpi" style="--kpi-accent:var(--red)"><div class="num">${errorCnt}</div><div class="lbl">#오류 태그</div></div>
      <div class="kpi" style="--kpi-accent:var(--gold)"><div class="num">${holdCnt}</div><div class="lbl">#보류 태그</div></div>
      <div class="kpi" style="--kpi-accent:var(--ink-faint)"><div class="num">${totalKg.toFixed(1)}</div><div class="lbl">영향 물량 (kg)</div></div>
    </div>

    <div class="dash-grid">
      <div class="panel" id="panel-category">
        <h3>오류분류별 현황 <span class="n">${catTotal}건 · 클릭해서 조회</span></h3>
        ${catEntries.length ? catEntries.map(([k,v],i) => `
          <div class="bar-row clickable" data-field="category" data-value="${escapeHtml(k)}" data-label="오류분류: ${escapeHtml(k)}" style="cursor:pointer;">
            <div class="bar-label">${escapeHtml(k)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100)}%;background:${DISPOSAL_COLORS[i%DISPOSAL_COLORS.length]}"></div></div>
            <div class="bar-count">${v}건 · ${Math.round(v/catTotal*100)}%</div>
          </div>`).join('') : `<div style="color:var(--ink-faint);font-size:13px;">데이터 없음</div>`}
        ${inlineDrillBlock('category', rows)}
      </div>

      <div class="panel" id="panel-disposal">
        <h3>처리방법 분포 <span class="n">클릭해서 조회</span></h3>
        ${dispEntries.length ? `
        <div class="donut-wrap">
          ${buildDonut(dispEntries)}
          <div class="donut-legend">
            ${dispEntries.map(([k,v],i)=>`<div class="legend-item clickable" data-field="disposal" data-value="${escapeHtml(k)}" data-label="처리방법: ${escapeHtml(k)}" style="cursor:pointer;"><span class="legend-dot" style="background:${DISPOSAL_COLORS[i%DISPOSAL_COLORS.length]}"></span>${escapeHtml(k)}<span class="pct">${v}건 (${Math.round(v/dispTotal*100)}%)</span></div>`).join('')}
          </div>
        </div>` : `<div style="color:var(--ink-faint);font-size:13px;">데이터 없음</div>`}
        ${inlineDrillBlock('disposal', rows)}
      </div>
    </div>

    <div class="panel" id="panel-month">
      <h3>월별 발생 추이 <span class="n">클릭해서 조회</span></h3>
      ${months.length ? `
      <div class="trend-chart">
        ${months.map(m => `
          <div class="trend-col clickable" data-field="month" data-value="${m}" data-label="월별: ${m}" style="cursor:pointer;">
            <div style="font-size:10px;color:var(--ink-muted);font-family:var(--font-mono);">${monthCounts[m]}</div>
            <div class="trend-bar" style="height:${Math.max(4, monthCounts[m]/maxMonth*80)}px;"></div>
            <div class="trend-label">${m.slice(2).replace('-','.')}</div>
          </div>`).join('')}
      </div>` : `<div style="color:var(--ink-faint);font-size:13px;">데이터 없음</div>`}
      ${inlineDrillBlock('month', rows)}
    </div>

    <div class="panel" id="panel-worker">
      <h3>작업자별 분포 <span class="n">교육·공정 개선 참고용 · 클릭해서 조회</span></h3>
      ${workerEntries.length ? workerEntries.map(([k,v],i) => {
        const stat = workerStatsMap[k];
        const rate = stat && stat.total_batches ? (v/stat.total_batches*100).toFixed(1) : null;
        const extra = stat ? ` (총 ${stat.total_batches}배치 / 오류율 ${rate}%)` : '';
        return `
        <div class="bar-row clickable" data-field="worker" data-value="${escapeHtml(k)}" data-label="작업자: ${escapeHtml(k)}" style="cursor:pointer;">
          <div class="bar-label">${escapeHtml(k)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/maxWorker*100)}%;background:${DISPOSAL_COLORS[i%DISPOSAL_COLORS.length]}"></div></div>
          <div class="bar-count" style="width:auto;white-space:nowrap;">${v}건${extra}</div>
        </div>`;
      }).join('') : `<div style="color:var(--ink-faint);font-size:13px;">데이터 없음</div>`}
      ${(() => {
        const allStats = Object.values(workerStatsMap);
        const sumTotal = allStats.reduce((s,w)=>s+(w.total_batches||0),0);
        const sumError = Object.values(workerCounts).reduce((s,v)=>s+v,0);
        const overallRate = sumTotal ? (sumError/sumTotal*100).toFixed(1) : '0.0';
        return `<div class="worker-summary">
          <div class="ws-item">전체 총 배치수 <b>${sumTotal.toLocaleString()}</b></div>
          <div class="ws-item">전체 오류건수 <b>${sumError.toLocaleString()}</b></div>
          <div class="ws-item">전체 오류율 <b>${overallRate}%</b></div>
        </div>`;
      })()}
      ${inlineDrillBlock('worker', rows)}
    </div>

    <div class="dash-grid">
      <div class="panel">
        <h3>품목별 발생 TOP 8</h3>
        <div class="rank-list">
          ${itemEntries.length ? itemEntries.map(([k,v],i)=>`<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${escapeHtml(k)}</span><span class="rank-val">${v}건</span></div>`).join('') : `<div style="color:var(--ink-faint);font-size:13px;">데이터 없음</div>`}
        </div>
      </div>
      <div class="panel">
        <h3>머신별 발생 현황</h3>
        <div class="rank-list">
          ${machEntries.length ? machEntries.map(([k,v],i)=>`<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${escapeHtml(k)}</span><span class="rank-val">${v}건</span></div>`).join('') : `<div style="color:var(--ink-faint);font-size:13px;">데이터 없음</div>`}
        </div>
      </div>
    </div>
  `;

  $('#periodPreset').addEventListener('change', (e) => applyPeriodPreset(e.target.value));
  $('#periodApply').addEventListener('click', () => {
    periodFrom = $('#periodFromInput').value;
    periodTo = $('#periodToInput').value;
    renderDashboard();
  });
  $('#reportBtn').addEventListener('click', () => generateReport(rows, { total, waiting, progress, history, errorCnt, holdCnt, totalKg, catEntries, dispEntries, itemEntries, machEntries }));

  $$('.clickable').forEach(el => el.addEventListener('click', () => {
    setDrilldown(el.dataset.field, el.dataset.value, el.dataset.label);
  }));
  wireInlineDrill(dash);
}

// ══════════════════════ 보고서 생성 ══════════════════════
function generateReport(rows, stats){
  const now = new Date();
  const periodLabel = (periodFrom || periodTo) ? `${periodFrom || '처음'} ~ ${periodTo || '현재'}` : '전체 기간';
  const genDate = now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
  const historyRows = rows.filter(r => r.current_stage === '히스토리')
    .sort((a,b) => (b.roast_date||'').localeCompare(a.roast_date||''));

  const tableRows = historyRows.map((r,i) => `
    <tr>
      <td>${i+1}</td>
      <td class="mono">${escapeHtml(r.cropster_batch_id)}</td>
      <td>${escapeHtml(r.roast_date||'-')}</td>
      <td>${escapeHtml(r.item_name||r.roast_name||'-')}</td>
      <td>${escapeHtml(r.category||'-')}</td>
      <td>${escapeHtml(r.disposal||'-')}</td>
      <td>${escapeHtml(r.assignee||'-')}</td>
      <td class="desc">${escapeHtml(r.description||'-')}</td>
    </tr>`).join('');

  const catRows = stats.catEntries.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td class="num">${v}</td><td class="num">${stats.total?Math.round(v/stats.total*100):0}%</td></tr>`).join('');
  const dispRows = stats.dispEntries.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td class="num">${v}</td><td class="num">${stats.total?Math.round(v/stats.total*100):0}%</td></tr>`).join('');

  const html = `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>RQI 품질관리 보고서 — ${periodLabel}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 20mm 16mm; }
  * { box-sizing: border-box; }
  body { font-family:'IBM Plex Sans KR', sans-serif; color:#1a1a1a; margin:0; padding:0 24px; background:#fff; }
  .cover { padding: 60px 0 30px; border-bottom: 3px solid #1a1a1a; margin-bottom: 28px; }
  .cover .eyebrow { font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:0.12em; font-size:12px; color:#B5651D; text-transform:uppercase; }
  .cover h1 { font-family:'Space Grotesk',sans-serif; font-size:32px; font-weight:700; margin:8px 0 4px; }
  .cover .meta { font-size:13px; color:#666; margin-top:10px; }
  .cover .meta span { margin-right: 20px; }
  h2.section { font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; margin:32px 0 14px; padding-bottom:8px; border-bottom:2px solid #1a1a1a; }
  .kpi-row { display:flex; gap:14px; margin-bottom: 10px; flex-wrap:wrap; }
  .kpi-box { flex:1; min-width:110px; border:1px solid #ddd; border-radius:6px; padding:14px; }
  .kpi-box .n { font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; }
  .kpi-box .l { font-size:11px; color:#666; margin-top:3px; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom: 10px; }
  th { text-align:left; background:#1a1a1a; color:#fff; padding:8px 10px; font-weight:600; font-size:11px; }
  td { padding:7px 10px; border-bottom:1px solid #e5e5e5; vertical-align:top; }
  tr:nth-child(even) td { background:#f7f6f4; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; }
  td.mono { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#555; }
  td.desc { font-size:11px; color:#444; max-width: 260px; }
  .stat-tables { display:flex; gap:20px; }
  .stat-tables > div { flex:1; }
  .footer-note { margin-top:40px; padding-top:14px; border-top:1px solid #ddd; font-size:10.5px; color:#999; }
  .print-btn { position:fixed; top:16px; right:16px; padding:10px 18px; background:#B5651D; color:#fff; border:none; border-radius:6px; font-family:'IBM Plex Sans KR',sans-serif; font-weight:600; cursor:pointer; font-size:13px; }
  @media print { .print-btn { display:none; } }
</style></head>
<body>
<button class="print-btn" onclick="window.print()">🖨 PDF로 저장 / 인쇄</button>
<div class="cover">
  <div class="eyebrow">Roast Quality Intelligence</div>
  <h1>오류리포트 품질관리 보고서</h1>
  <div class="meta"><span><b>대상 기간</b> ${periodLabel}</span><span><b>작성일</b> ${genDate}</span><span><b>보고 건수</b> ${stats.total}건</span></div>
</div>

<h2 class="section">핵심 지표</h2>
<div class="kpi-row">
  <div class="kpi-box"><div class="n">${stats.total}</div><div class="l">전체 등록 배치</div></div>
  <div class="kpi-box"><div class="n">${stats.history}</div><div class="l">처리 완료</div></div>
  <div class="kpi-box"><div class="n">${stats.progress}</div><div class="l">처리 진행중</div></div>
  <div class="kpi-box"><div class="n">${stats.waiting}</div><div class="l">입력 필요</div></div>
  <div class="kpi-box"><div class="n">${stats.totalKg.toFixed(1)}kg</div><div class="l">영향 물량</div></div>
</div>

<h2 class="section">분류별 요약</h2>
<div class="stat-tables">
  <div>
    <table><thead><tr><th>오류분류</th><th style="text-align:right">건수</th><th style="text-align:right">비율</th></tr></thead>
    <tbody>${catRows || '<tr><td colspan="3">데이터 없음</td></tr>'}</tbody></table>
  </div>
  <div>
    <table><thead><tr><th>처리방법</th><th style="text-align:right">건수</th><th style="text-align:right">비율</th></tr></thead>
    <tbody>${dispRows || '<tr><td colspan="3">데이터 없음</td></tr>'}</tbody></table>
  </div>
</div>

<h2 class="section">상세 처리 완료 목록 (${historyRows.length}건)</h2>
<table>
  <thead><tr><th>#</th><th>Roast ID</th><th>일자</th><th>품목</th><th>오류분류</th><th>처리방법</th><th>담당자</th><th>세부내용</th></tr></thead>
  <tbody>${tableRows || '<tr><td colspan="8">완료된 항목이 없습니다</td></tr>'}</tbody>
</table>

<div class="footer-note">본 보고서는 RQI(Roast Quality Intelligence) 시스템에서 자동 생성되었습니다. 목표이탈이 곧 품질불량을 의미하지 않으며, 데이터 입력 오류와 실제 공정이탈은 별도로 구분하여 해석해야 합니다.</div>
</body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

async function loadWorkerStats(){
  const { data } = await sb.from('오류리포트_worker_stats').select('*');
  workerStatsMap = {};
  (data || []).forEach(r => { workerStatsMap[r.worker] = r; });
}

// ── 초기화 ──
(async function init(){
  await loadOptions();
  await loadWorkerStats();
  await loadSyncState();
  await loadAll();
})();
</script>

</body>
</html>
